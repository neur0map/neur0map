<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 56" width="880" height="56" role="img" aria-label="What I maintain.">
<title>What I maintain.</title>
<defs>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>

</defs>
<style>@font-face{font-family:nm-sm;src:url(data:font/woff2;base64,) format("woff2");font-style:normal}
.m{font-family:nm-sm,ui-monospace,monospace;fill:#958f87}.m:not([font-size]){font-size:10px}.m:not([letter-spacing]){letter-spacing:.14em}
.d{font-family:nm-fr,Georgia,serif;fill:#cdc4ba}
.i{font-family:nm-fri,Georgia,serif;font-style:italic;fill:#958f87}
.s{font-family:nm-sg,system-ui,sans-serif;fill:#b0a9a0}
.l{font-family:nm-sgl,system-ui,sans-serif;fill:#cdc4ba}
.j{font-family:nm-jp,sans-serif;fill:#cdc4ba}
.ink{fill:#cdc4ba}.dim{fill:#b0a9a0}.mut{fill:#958f87}.fnt{fill:#807a73}.sun{fill:#ce5e32}
.hair{fill:none;stroke:rgba(205,196,186,.26);stroke-width:1}.soft{fill:none;stroke:rgba(205,196,186,.13);stroke-width:1}.strong{fill:none;stroke:rgba(205,196,186,.42);stroke-width:1}
.sunl{fill:none;stroke:#ce5e32;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}

@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.rise{animation:rise .62s cubic-bezier(.215,.61,.355,1) both;transform-box:fill-box}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fade{animation:fade .9s cubic-bezier(.215,.61,.355,1) both}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.draw{stroke-dasharray:var(--len);animation:draw 1.1s cubic-bezier(.215,.61,.355,1) both}
@keyframes odo{from{transform:translateY(0)}to{transform:translateY(var(--to))}}
.odo{transform:translateY(var(--to));animation:odo 1.6s cubic-bezier(.16,1,.3,1) both}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes nudge{0%,72%,100%{transform:none}82%{transform:translate(2px,-2px)}}
.nudge{animation:nudge 3.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(1turn)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

</style>
<rect width="880" height="56" rx="2" fill="#000000"/>
<text class="m" x="36" y="30"><tspan class="sun">05</tspan>  WHAT I MAINTAIN</text>
<text class="m fnt" x="844" y="30" text-anchor="end">4 PROJECTS · 679 STARS</text>

<line class="hair" x1="36" x2="844" y1="42.5" y2="42.5"/>
<rect width="880" height="56" rx="2" filter="url(#grain)" opacity=".055" pointer-events="none"/>
<rect x=".5" y=".5" width="879" height="55" rx="2" class="soft"/>
</svg>
